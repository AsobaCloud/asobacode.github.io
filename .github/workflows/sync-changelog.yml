name: Sync Changelog from Platform Repository

on:
  # Run on a schedule (daily at 2 AM UTC)
  schedule:
    - cron: '0 2 * * *'
  # Allow manual triggering
  workflow_dispatch:
  # Trigger when changelog.md is manually updated (optional)
  push:
    paths:
      - 'changelog.md'

jobs:
  sync-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout documentation repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    
    - name: Fetch CHANGELOG from platform repository
      id: fetch-changelog
      env:
        PLATFORM_REPO: ${{ secrets.PLATFORM_REPO || 'AsobaCloud/platform' }}
        PLATFORM_BRANCH: ${{ secrets.PLATFORM_BRANCH || 'main' }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Fetch the CHANGELOG.md from the platform repository using GitHub API
        # This works for both public and private repos (if token has access)
        echo "📥 Fetching CHANGELOG.md from ${PLATFORM_REPO} (branch: ${PLATFORM_BRANCH})..."
        
        # Use GitHub API to fetch file content (works for private repos)
        gh api "repos/${PLATFORM_REPO}/contents/CHANGELOG.md?ref=${PLATFORM_BRANCH}" \
          --jq '.content' | base64 -d > /tmp/platform-changelog.md || {
          echo "❌ Failed to fetch CHANGELOG from platform repository"
          echo "💡 Ensure GITHUB_TOKEN has access to ${PLATFORM_REPO}"
          exit 1
        }
        
        # Check if file was downloaded successfully
        if [ ! -s /tmp/platform-changelog.md ]; then
          echo "❌ Downloaded changelog is empty"
          echo "💡 Check that the repository, branch, and file path are correct"
          exit 1
        fi
        
        echo "✅ Downloaded $(wc -l < /tmp/platform-changelog.md) lines"
        
        # Extract the content (skip front matter if present)
        if grep -q "^---" /tmp/platform-changelog.md; then
          # Has front matter, extract content after second ---
          sed -n '/^---$/,/^---$/!{ /^---$/d; p; }' /tmp/platform-changelog.md | sed '1d' > /tmp/changelog-content.md
        else
          # No front matter, use as-is
          cp /tmp/platform-changelog.md /tmp/changelog-content.md
        fi
        
        # Preserve the front matter from our changelog.md
        head -n 5 changelog.md > /tmp/front-matter.md
        
        # Combine front matter with new content
        cat /tmp/front-matter.md > /tmp/new-changelog.md
        echo "" >> /tmp/new-changelog.md
        cat /tmp/changelog-content.md >> /tmp/new-changelog.md
        
        # Check if content has changed
        if ! cmp -s changelog.md /tmp/new-changelog.md; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "✅ Changelog content has changed"
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "ℹ️ No changes detected"
        fi
    
    - name: Update changelog.md
      if: steps.fetch-changelog.outputs.has_changes == 'true'
      run: |
        cp /tmp/new-changelog.md changelog.md
        echo "✅ Updated changelog.md with content from platform repository"
    
    - name: Commit and push changes
      if: steps.fetch-changelog.outputs.has_changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add changelog.md
        git commit -m "chore: sync changelog from platform repository [skip ci]" || exit 0
        git push
