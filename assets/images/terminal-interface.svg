<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal window background -->
  <rect width="800" height="400" fill="#2E3436" rx="8"/>
  
  <!-- Terminal title bar -->
  <rect width="800" height="30" fill="#555753" rx="8 8 0 0"/>
  <text x="400" y="20" text-anchor="middle" fill="#EEEEEC" font-family="Ubuntu Mono, monospace" font-size="12">AsobaCode Terminal</text>
  
  <!-- Terminal window controls -->
  <circle cx="15" cy="15" r="6" fill="#EF2929"/>
  <circle cx="35" cy="15" r="6" fill="#FCE94F"/>
  <circle cx="55" cy="15" r="6" fill="#8AE234"/>
  
  <!-- Terminal border -->
  <rect x="15" y="45" width="770" height="340" fill="none" stroke="#729FCF" stroke-width="2" rx="4"/>
  
  <!-- Terminal content background -->
  <rect x="17" y="47" width="766" height="336" fill="#2E3436"/>
  
  <!-- Terminal content -->
  <text x="30" y="75" fill="#B5BBAE" font-family="Ubuntu Mono, monospace" font-size="14">Type your questions or requests naturally:</text>
  
  <!-- Example commands with bullet points -->
  <text x="30" y="100" fill="#8AE234" font-family="Ubuntu Mono, monospace" font-size="14">• </text>
  <text x="45" y="100" fill="#B5BBAE" font-family="Ubuntu Mono, monospace" font-size="14">'generate a python hello world function'</text>
  
  <text x="30" y="120" fill="#8AE234" font-family="Ubuntu Mono, monospace" font-size="14">• </text>
  <text x="45" y="120" fill="#B5BBAE" font-family="Ubuntu Mono, monospace" font-size="14">'summarize the pdf located in C:\users\admin\Documents\Tech'</text>
  
  <!-- Slash commands section -->
  <text x="30" y="155" fill="#B5BBAE" font-family="Ubuntu Mono, monospace" font-size="14">Use "/" commands to drive the work you need:</text>
  
  <text x="30" y="180" fill="#8AE234" font-family="Ubuntu Mono, monospace" font-size="14">• </text>
  <text x="45" y="180" fill="#AD7FA8" font-family="Ubuntu Mono, monospace" font-size="14">/help</text>
  <text x="85" y="180" fill="#B5BBAE" font-family="Ubuntu Mono, monospace" font-size="14"> - show help menu</text>
  
  <text x="30" y="200" fill="#8AE234" font-family="Ubuntu Mono, monospace" font-size="14">• </text>
  <text x="45" y="200" fill="#AD7FA8" font-family="Ubuntu Mono, monospace" font-size="14">/commands</text>
  <text x="125" y="200" fill="#B5BBAE" font-family="Ubuntu Mono, monospace" font-size="14"> - list all commands</text>
  
  <!-- Current directory -->
  <text x="30" y="235" fill="#B5BBAE" font-family="Ubuntu Mono, monospace" font-size="14">Current working directory: </text>
  <text x="250" y="235" fill="#FCE94F" font-family="Ubuntu Mono, monospace" font-size="14">/home/shingai</text>
  
  <!-- Exit instruction -->
  <text x="30" y="270" fill="#729FCF" font-family="Ubuntu Mono, monospace" font-size="14">Use 'exit' or Ctrl+C to quit</text>
  
  <!-- AI response section with border -->
  <rect x="30" y="295" width="740" height="70" fill="none" stroke="#729FCF" stroke-width="1" rx="4"/>
  <text x="45" y="315" fill="#34E2E2" font-family="Ubuntu Mono, monospace" font-size="14">🤖 Analyzing request with file system context...</text>
  <text x="45" y="335" fill="#8AE234" font-family="Ubuntu Mono, monospace" font-size="14">✅ Analyzing request with file system context... - Complete (0.0s)</text>
  <text x="45" y="355" fill="#B5BBAE" font-family="Ubuntu Mono, monospace" font-size="14">156 input + 28 output = 184 total tokens | 💰 $0.0002</text>
  
  <!-- Prompt indicator -->
  <text x="30" y="385" fill="#8AE234" font-family="Ubuntu Mono, monospace" font-size="14">🤖 |</text>
</svg>