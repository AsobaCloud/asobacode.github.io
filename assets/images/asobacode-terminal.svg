<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .terminal-bg { fill: #2d1b69; }
      .terminal-border { stroke: #00bcd4; stroke-width: 2; fill: none; }
      .terminal-text { font-family: 'Monaco', 'Consolas', monospace; font-size: 11px; }
      .header-text { fill: #00bcd4; font-weight: bold; }
      .prompt-text { fill: #ffffff; }
      .command-text { fill: #ffd700; }
      .success-text { fill: #4caf50; }
      .info-text { fill: #00bcd4; }
      .ai-text { fill: #bb86fc; }
      .subtle-text { fill: #9e9e9e; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#1a0d3d"/>
  
  <!-- Terminal window -->
  <rect x="40" y="30" width="720" height="340" rx="8" class="terminal-bg"/>
  <rect x="40" y="30" width="720" height="340" rx="8" class="terminal-border"/>
  
  <!-- Header -->
  <text x="400" y="55" text-anchor="middle" class="terminal-text header-text" font-size="14">Ona Terminal</text>
  
  <!-- Content lines -->
  <text x="60" y="85" class="terminal-text prompt-text">Type your questions or requests naturally:</text>
  <text x="80" y="105" class="terminal-text subtle-text">• 'generate a python hello world function'</text>
  <text x="80" y="125" class="terminal-text subtle-text">• 'summarize the pdf located in C:\users\admin\Documents\Tech'</text>
  
  <text x="60" y="155" class="terminal-text prompt-text">Use "/" commands to drive the work you need:</text>
  <text x="80" y="175" class="terminal-text subtle-text">• /help - show help menu</text>
  <text x="80" y="195" class="terminal-text subtle-text">• /commands - list all commands</text>
  
  <text x="60" y="225" class="terminal-text prompt-text">Current working directory: /home/shingai</text>
  
  <text x="60" y="255" class="terminal-text subtle-text">Use 'exit' or Ctrl+C to quit</text>
  
  <!-- Interactive example -->
  <text x="60" y="285" class="terminal-text info-text">🤖 please provide a summary of the assetmgmt.pdf document</text>
  <text x="60" y="305" class="terminal-text ai-text">🧠 🧠 Analyzing request with file system context...</text>
  <text x="60" y="325" class="terminal-text success-text">✅ 🧠 Analyzing request with file system context... - Complete (0.0s)</text>
  <text x="60" y="345" class="terminal-text subtle-text">📊 156 input + 28 output = 184 total tokens | 💰 $0.0002</text>
  
  <!-- Provider info box -->
  <rect x="60" y="355" width="680" height="12" rx="4" fill="#3d2a5e" stroke="#00bcd4" stroke-width="1"/>
  <text x="70" y="365" class="terminal-text ai-text" font-size="10">🤖 AI Assistant Response</text>
  <text x="650" y="365" class="terminal-text subtle-text" font-size="9">Provider: bedrock | Model: amazon.nova-pro-v1:0 | Cost: $0.0002</text>
</svg>