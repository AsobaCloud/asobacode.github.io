<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cmd-bg { fill: #0c0c0c; stroke: #cccccc; stroke-width: 1; }
      .title-bar { fill: #2d2d30; }
      .cmd-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; fill: #ffffff; }
      .prompt-text { fill: #ffffff; }
      .success-text { fill: #16c60c; }
      .step-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #323130; }
      .window-controls { fill: #ffffff; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Command Prompt Window -->
  <rect x="50" y="60" width="500" height="280" rx="4" class="cmd-bg"/>
  
  <!-- Title Bar -->
  <rect x="50" y="60" width="500" height="25" class="title-bar"/>
  
  <!-- Window Controls -->
  <rect x="515" y="67" width="10" height="10" fill="#ff5f56"/>
  <rect x="500" y="67" width="10" height="10" fill="#ffbd2e"/>
  <rect x="485" y="67" width="10" height="10" fill="#27ca3f"/>
  
  <!-- Title Text -->
  <text x="60" y="78" fill="#cccccc" font-family="Segoe UI" font-size="12">Command Prompt</text>
  
  <!-- Command Content -->
  <text x="65" y="110" class="cmd-text">Microsoft Windows [Version 10.0.22621.2715]</text>
  <text x="65" y="130" class="cmd-text">(c) Microsoft Corporation. All rights reserved.</text>
  
  <text x="65" y="160" class="cmd-text">C:\Users\Admin></text>
  <text x="185" y="160" class="cmd-text">ona-terminal --version</text>
  
  <text x="65" y="185" class="success-text">Ona Terminal v0.1.0</text>
  <text x="65" y="205" class="success-text">✓ Installation successful</text>
  <text x="65" y="225" class="success-text">✓ AWS Bedrock integration ready</text>
  <text x="65" y="245" class="success-text">✓ All dependencies loaded</text>
  
  <text x="65" y="275" class="cmd-text">C:\Users\Admin></text>
  <text x="185" y="275" class="cmd-text">ona-terminal</text>
  
  <text x="65" y="300" class="success-text">🚀 Launching Ona Terminal...</text>
  <text x="65" y="320" class="success-text">Type /help for available commands</text>
  
  <!-- Step Annotation -->
  <circle cx="400" cy="350" r="20" fill="#28a745" opacity="0.9"/>
  <text x="400" y="356" text-anchor="middle" fill="white" font-weight="bold" font-size="16">3</text>
  
  <!-- Arrow pointing to command -->
  <path d="M 380 340 Q 320 320 220 165" stroke="#28a745" stroke-width="3" fill="none" marker-end="url(#arrowhead3)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  
  <!-- Instruction Text -->
  <text x="430" y="355" class="step-text" font-weight="bold">Verify installation works</text>
  
  <!-- Success badge -->
  <rect x="450" y="100" width="80" height="30" rx="15" fill="#28a745"/>
  <text x="490" y="120" text-anchor="middle" fill="white" font-family="Segoe UI" font-size="12" font-weight="bold">SUCCESS</text>
</svg>