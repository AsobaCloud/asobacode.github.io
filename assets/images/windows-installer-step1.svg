<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .window-bg { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; }
      .title-bar { fill: #007bff; }
      .button-bg { fill: #28a745; stroke: #1e7e34; stroke-width: 1; }
      .text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #212529; }
      .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: white; font-weight: bold; }
      .step-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #495057; }
      .icon-bg { fill: #17a2b8; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#e9ecef"/>
  
  <!-- Browser/Download Window -->
  <rect x="50" y="50" width="500" height="300" rx="8" class="window-bg"/>
  
  <!-- Title Bar -->
  <rect x="50" y="50" width="500" height="40" rx="8" class="title-bar"/>
  <rect x="50" y="90" width="500" height="-8" fill="#007bff"/>
  
  <!-- Window Controls -->
  <circle cx="520" cy="70" r="8" fill="#ff5f57"/>
  <circle cx="500" cy="70" r="8" fill="#ffbd2e"/>
  <circle cx="480" cy="70" r="8" fill="#28ca42"/>
  
  <!-- Title Text -->
  <text x="70" y="75" class="title-text">GitHub Releases - AsobaCloud/terminal</text>
  
  <!-- Content Area -->
  <rect x="70" y="110" width="460" height="220" fill="white" stroke="#dee2e6"/>
  
  <!-- Release Item -->
  <rect x="90" y="130" width="420" height="80" fill="#f8f9fa" stroke="#e9ecef" rx="4"/>
  
  <!-- Icon -->
  <circle cx="120" cy="160" r="15" class="icon-bg"/>
  <text x="120" y="166" text-anchor="middle" class="title-text" font-size="12">📦</text>
  
  <!-- Release Info -->
  <text x="150" y="150" class="text" font-weight="bold">v0.1.0 - Ona Terminal</text>
  <text x="150" y="170" class="step-text">Latest release with Windows installer</text>
  <text x="150" y="185" class="step-text">• ona-terminal-setup.exe (Windows Installer)</text>
  
  <!-- Download Button -->
  <rect x="380" y="145" width="120" height="30" rx="4" class="button-bg"/>
  <text x="440" y="165" text-anchor="middle" fill="white" class="text" font-weight="bold">Download</text>
  
  <!-- Step Annotation -->
  <circle cx="440" cy="240" r="20" fill="#dc3545" opacity="0.9"/>
  <text x="440" y="246" text-anchor="middle" fill="white" font-weight="bold" font-size="16">1</text>
  
  <!-- Arrow -->
  <path d="M 440 220 Q 440 200 420 185" stroke="#dc3545" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  
  <!-- Instruction Text -->
  <text x="480" y="245" class="step-text" font-weight="bold">Click to download</text>
  <text x="480" y="260" class="step-text">ona-terminal-setup.exe</text>
</svg>