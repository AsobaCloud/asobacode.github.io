<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .installer-bg { fill: #ffffff; stroke: #0078d4; stroke-width: 3; }
      .title-bar { fill: #0078d4; }
      .button-bg { fill: #0078d4; stroke: #106ebe; stroke-width: 1; }
      .text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #323130; }
      .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: white; font-weight: bold; }
      .step-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #605e5c; }
      .checkbox-bg { fill: white; stroke: #8a8886; stroke-width: 2; }
      .checked { fill: #0078d4; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#f3f2f1"/>
  
  <!-- Installer Window -->
  <rect x="75" y="40" width="450" height="320" rx="8" class="installer-bg"/>
  
  <!-- Title Bar -->
  <rect x="75" y="40" width="450" height="35" rx="8" class="title-bar"/>
  <rect x="75" y="75" width="450" height="-8" fill="#0078d4"/>
  
  <!-- Window Controls -->
  <rect x="485" y="50" width="15" height="15" fill="#ffffff" opacity="0.3"/>
  <text x="492" y="61" text-anchor="middle" fill="white" font-size="10">✕</text>
  
  <!-- Title Text -->
  <text x="90" y="62" class="title-text">Ona Terminal Setup</text>
  
  <!-- Main Content Area -->
  <rect x="95" y="90" width="410" height="240" fill="#faf9f8"/>
  
  <!-- Icon and Welcome -->
  <circle cx="140" cy="130" r="25" fill="#0078d4"/>
  <text x="140" y="138" text-anchor="middle" fill="white" font-size="20">🚀</text>
  
  <text x="180" y="125" class="text" font-weight="bold" font-size="18">Welcome to Ona Terminal Setup</text>
  <text x="180" y="145" class="step-text">This will install Ona Terminal on your computer.</text>
  
  <!-- Installation Options -->
  <text x="110" y="180" class="text" font-weight="bold">Installation Options:</text>
  
  <!-- Checkbox 1 -->
  <rect x="120" y="195" width="16" height="16" class="checkbox-bg"/>
  <path d="M 125 202 L 128 206 L 134 199" stroke="#0078d4" stroke-width="2" fill="none"/>
  <text x="145" y="207" class="step-text">Install to C:\Program Files\OnaTerminal\</text>
  
  <!-- Checkbox 2 -->
  <rect x="120" y="220" width="16" height="16" class="checkbox-bg"/>
  <path d="M 125 227 L 128 231 L 134 224" stroke="#0078d4" stroke-width="2" fill="none"/>
  <text x="145" y="232" class="step-text">Create Start Menu shortcuts</text>
  
  <!-- Checkbox 3 -->
  <rect x="120" y="245" width="16" height="16" class="checkbox-bg"/>
  <path d="M 125 252 L 128 256 L 134 249" stroke="#0078d4" stroke-width="2" fill="none"/>
  <text x="145" y="257" class="step-text">Add to PATH for command-line access</text>
  
  <!-- Buttons -->
  <rect x="330" y="290" width="80" height="30" rx="4" class="button-bg"/>
  <text x="370" y="310" text-anchor="middle" fill="white" class="text" font-weight="bold">Install</text>
  
  <rect x="240" y="290" width="80" height="30" rx="4" fill="#f3f2f1" stroke="#8a8886"/>
  <text x="280" y="310" text-anchor="middle" fill="#323130" class="text">Cancel</text>
  
  <!-- Step Annotation -->
  <circle cx="370" cy="350" r="20" fill="#dc3545" opacity="0.9"/>
  <text x="370" y="356" text-anchor="middle" fill="white" font-weight="bold" font-size="16">2</text>
  
  <!-- Arrow -->
  <path d="M 370 330 Q 370 315 370 305" stroke="#dc3545" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  
  <!-- Instruction Text -->
  <text x="410" y="355" class="step-text" font-weight="bold">Click Install</text>
</svg>