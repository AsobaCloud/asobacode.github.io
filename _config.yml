title: "Asoba Open Source"
remote_theme: "just-the-docs/just-the-docs"

# Search configuration
search_enabled: true
heading_anchors: true

# Kramdown configuration to prevent anchor conflicts
kramdown:
  auto_ids: true          # Enable automatic ID generation for anchor links
  input: GFM              # Use GitHub Flavored Markdown
  hard_wrap: false
  syntax_highlighter: rouge
  toc_levels: "1..3"
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Sidebar navigation
nav_external_links:
  - title: Asoba Website
    url: https://asoba.co
    hide_icon: false

# Sidebar styling
color_scheme: light

# Table of contents settings
toc:
  enabled: true
  h_min: 2
  h_max: 3

# Production settings
baseurl: ""
url: "https://code.asoba.co"

# Jekyll plugins for GitHub Pages
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Processing settings
markdown: kramdown
highlighter: rouge

# Ensure proper file processing
defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "default"